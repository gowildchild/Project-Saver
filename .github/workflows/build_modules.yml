name: Compile Pluggable Module Extensions

on:
  push:
    branches: 
      - modules-distribution
      - "modules**"
    paths:
      - 'modules/**'
  pull_request:
    branches: 
      - modules-distribution
      - "modules**"
    paths:
      - 'modules/**'

permissions:
  contents: write

jobs:
  compile-matrix-modules:
    runs-on: windows-latest
    steps:
    - name: Checkout Source Repository Code
      uses: actions/checkout@v4

    - name: Setup Python Environment Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Packaging Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller 
    ## beautifulsoup4 reportlab

    - name: Run Automated Compilation and Hash Ledger Routine
      shell: bash
      run: |
        python3 << 'EOF'
        import os
        import sys
        import json
        import hashlib
        import subprocess
        import importlib.util
        import time

        def calculate_file_sha256(file_path):
            sha256_hash = hashlib.sha256()
            with open(file_path, "rb") as f:
                for byte_block in iter(lambda: f.read(4096), b""):
                    sha256_hash.update(byte_block)
            return sha256_hash.hexdigest().lower()

        modules_dir = "modules"
        dist_dir = "dist_modules"
        build_dir = "build_modules"

        os.makedirs(dist_dir, exist_ok=True)
        os.makedirs(build_dir, exist_ok=True)

        if modules_dir not in sys.path:
            sys.path.insert(0, modules_dir)

        global_manifest = {
            "build_timestamp": time.strftime("%Y-%m-%d %H:%M:%S UTC", time.gmtime()),
            "modules": {}
        }

        if not os.path.exists(modules_dir):
            print("[-] Error: Modules folder context missing.")
            sys.exit(1)

        module_files = [f for f in os.listdir(modules_dir) if f.endswith(".py") and f != "__init__.py"]
        
        for file_entry in module_files:
            module_name = file_entry[:-3]
            file_path = os.path.join(modules_dir, file_entry)
            print(f"\n[*] Compiling Pluggable Asset: {module_name.upper()}")

            try:
                spec = importlib.util.spec_from_file_location(module_name, file_path)
                mod = importlib.util.module_from_spec(spec)
                spec.loader.exec_module(mod)

                if not hasattr(mod, "MODULE_MANIFEST"):
                    print(f"[-] Skipping {file_entry}: Missing manifest matrix.")
                    continue

                manifest = mod.MODULE_MANIFEST
                binary_name = f"{module_name}.exe"
                compiled_binary_path = os.path.join(dist_dir, binary_name)

                cmd = [
                    "pyinstaller",
                    "--onefile",
                    "--clean",
                    "--exclude-module=reportlab",
                    "--exclude-module=bs4",                    
                    f"--distpath={dist_dir}",
                    f"--workpath={build_dir}",
                    f"--name={module_name}",
                    file_path
                ]
                
                result = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
                if result.returncode != 0:
                    print(f"[-] PyInstaller compilation failed for {module_name}")
                    continue

                if os.path.exists(compiled_binary_path):
                    binary_hash = calculate_file_sha256(compiled_binary_path)
                    print(f"[+] Computed Checksum FOOTPRINT: {binary_hash}")

                    global_manifest["modules"][module_name] = {
                        "display_name": manifest.get("display_name"),
                        "menu_shortcut": manifest.get("menu_shortcut"),
                        "version": manifest.get("meta", {}).get("version", "v0.0.1"),
                        "requires_core": manifest.get("meta", {}).get("requires", "v0.0.79"),
                        "autostart": manifest.get("autostart", False),
                        "binary_filename": binary_name,
                        "sha256": binary_hash
                    }
            except Exception as e:
                print(f"[-] Code check bypass failed on {file_entry}: {e}")

        with open(os.path.join(dist_dir, "manifest.json"), "w", encoding="utf-8") as json_file:
            json.dump(global_manifest, json_file, indent=2)
        print("[+] Manifest tracking ledger compiled successfully.")
        EOF

    - name: Upload Pluggable Module Assets to Release Memory
      uses: actions/upload-artifact@v4
      with:
        name: pluggable-module-packages
        path: dist_modules/*
