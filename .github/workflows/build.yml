name: Compile Standalone Binary

on:
  push:
    branches: [ main, master ]
    paths:
      - 'master/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'master/**'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.get_version.outputs.VERSION }}
    steps:
    - name: Checkout Source Repository Code
      uses: actions/checkout@v4

    - name: Extract Version from Source
      id: get_version
      run: |
        VERSION_STR=$(python3 -c "import re; f=open('master/project_saver.py'); m=re.search(r'VERSION\s*=\s*[\"\']([^\"\']+)[\"\']', f.read()); print(m.group(1)) if m else print('')")
        if [ -z "$VERSION_STR" ]; then
          echo "[-] Error: Failed to extract VERSION string from source code."
          exit 1
        fi
        echo "VERSION=$VERSION_STR" >> $GITHUB_OUTPUT
        echo "[+] Successfully captured version string: $VERSION_STR"

  compile-windows:
    needs: build-and-release
    runs-on: windows-latest
    steps:
    - name: Checkout Source Repository Code
      uses: actions/checkout@v4

    - name: Setup Python Environment Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Packaging Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller beautifulsoup4 reportlab

    - name: Generate Dynamic Version Resource File
      shell: bash
      run: |
        python3 -c '
        import re
        ver = "${{ needs.build-and-release.outputs.app_version }}"
        clean_ver = re.sub(r"[vV]", "", ver)
        parts = clean_ver.split(".")
        while len(parts) < 3: parts.append("0")
        major, minor, patch = parts[0], parts[1], parts[2]
        
        template = """VSVersionInfo(
          ffi=FixedFileInfo(
            filevers=({0}, {1}, {2}, 0),
            prodvers=({0}, {1}, {2}, 0),
            mask=0x3f,
            flags=0x0,
            OS=0x40004,
            fileType=0x1,
            subtype=0x0,
            date=(0, 0)
          ),
          kids=[
            StringFileInfo([
              StringTable(
                "040904b0",
                [
                  StringStruct("CompanyName", "Gunther Voet"),
                  StringStruct("FileDescription", "Project Saver Background Service Daemon"),
                  StringStruct("FileVersion", "{3}"),
                  StringStruct("InternalName", "project_saver"),
                  StringStruct("LegalCopyright", "Copyright (c) 2026 Gunther Voet. All Rights Reserved."),
                  StringStruct("OriginalFilename", "project_saver.exe"),
                  StringStruct("ProductName", "Project Saver Application"),
                  StringStruct("ProductVersion", "{3}")
                ]
              )
            ]),
            VarFileInfo([VarStruct("Translation", [1033, 1200])])
          ]
        )"""
        
        content = template.format(major, minor, patch, clean_ver)
        with open("master/version_info.txt", "w", encoding="utf-8") as f:
            f.write(content)
        print("[+] Dynamic version_info.txt file generated successfully.")

        template_inno = """[Setup]
        AppName=Project Saver
        AppVersion={0}
        AppPublisher=Gunther Voet
        AppPublisherURL=https://github.com/gowildchild/Project-Saver
        DefaultDirName={{userlocalappdata}}\\ProjectSaver
        DefaultGroupName=Project Saver
        DisableProgramGroupPage=yes
        OutputDir=..\\dist
        OutputBaseFilename=project_saver_setup
        Compression=lzma
        SolidCompression=yes
        PrivilegesRequired=lowest
        CloseApplications=yes

        [Files]
        Source: "..\\dist\\project_saver_{1}.exe"; DestDir: "{{app}}"; DestName: "project_saver.exe"; Flags: ignoreversion
        Source: "..\\dist\\manifest_windows.txt"; DestDir: "{{app}}"; Flags: ignoreversion

        [Icons]
        Name: "{{userdesktop}}\\Project Saver"; Filename: "{{app}}\\project_saver.exe"; WorkingDir: "{{app}}"
        Name: "{{userstartup}}\\Project Saver Daemon"; Filename: "{{app}}\\project_saver.exe"; WorkingDir: "{{app}}"; Comment: "Launches Project Saver background daemon on boot"

        [Run]
        Filename: "{{app}}\\project_saver.exe"; Description: "Launch Project Saver Service Daemon Now"; Flags: nowait postinstall skipifsilent

        [UninstallDelete]
        Type: filesandordirs; Name: "{{app}}\\singlefile-project-saver-config.json"
        Type: filesandordirs; Name: "{{app}}\\project_saver.cfg"
        Type: filesandordirs; Name: "{{app}}\\export"
        Type: filesandordirs; Name: "{{app}}"
        """
        
        content_inno = template_inno.format(clean_ver, ver)
        with open("master/installer_blueprint.iss", "w", encoding="utf-8") as f:
            f.write(content_inno)
        print("[+] Dynamic installer_blueprint.iss file generated successfully.")        
        '

    - name: Compile Standalone Executable
      working-directory: ./master
      run: |
        pyinstaller --onefile --distpath ../dist --workpath ../build --version-file=version_info.txt project_saver.py

    - name: Generate Release Manifest
      shell: bash
      run: |
        cd dist
        mv project_saver.exe project_saver_${{ needs.build-and-release.outputs.app_version }}.exe
        RAW_HASH=$(certutil -hashfile project_saver_${{ needs.build-and-release.outputs.app_version }}.exe SHA1 | sed -n '2p' | tr -d '[:space:]')
        echo "==================================================" > manifest_windows.txt
        echo "   PROJECT SAVER RELEASE MANIFEST                 " >> manifest_windows.txt
        echo "==================================================" >> manifest_windows.txt
        echo "Build Timestamp : $(date -u)" >> manifest_windows.txt
        echo "Version Tag     : ${{ needs.build-and-release.outputs.app_version }}" >> manifest_windows.txt
        echo "Platform        : Windows x64 Standalone Asset" >> manifest_windows.txt
        echo "Application File: project_saver_${{ needs.build-and-release.outputs.app_version }}.exe" >> manifest_windows.txt
        echo "--------------------------------------------------" >> manifest_windows.txt
        echo "SHA-1 Checksum  : $RAW_HASH" >> manifest_windows.txt
        echo "==================================================" >> manifest_windows.txt

    - name: Compile Windows Setup Installer Executable
      run: |
        iscc master/installer_blueprint.iss

    - name: Upload Windows Asset to Job Memory
      uses: actions/upload-artifact@v4
      with:
        name: windows-assets
        path: |
          dist/project_saver_${{ needs.build-and-release.outputs.app_version }}.exe
          dist/manifest_windows.txt
          dist/project_saver_setup.exe        

  compile-linux:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Repository Code
      uses: actions/checkout@v4

    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Packaging Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller beautifulsoup4 reportlab

    - name: Compile Linux Binary
      working-directory: ./master
      run: |
        pyinstaller --onefile --distpath ../dist --workpath ../build project_saver.py

    - name: Generate Release Manifest
      run: |
        cd dist
        mv project_saver project_saver_${{ needs.build-and-release.outputs.app_version }}_linux
        RAW_HASH=$(sha1sum project_saver_${{ needs.build-and-release.outputs.app_version }}_linux | awk '{print $1}')
        echo "==================================================" > manifest_linux.txt
        echo "   PROJECT SAVER RELEASE MANIFEST                 " >> manifest_linux.txt
        echo "==================================================" >> manifest_linux.txt
        echo "Build Timestamp : $(date -u)" >> manifest_linux.txt
        echo "Version Tag     : ${{ needs.build-and-release.outputs.app_version }}" >> manifest_linux.txt
        echo "Platform        : Linux x64 Standalone Asset" >> manifest_linux.txt
        echo "Application File: project_saver_${{ needs.build-and-release.outputs.app_version }}_linux" >> manifest_linux.txt
        echo "--------------------------------------------------" >> manifest_linux.txt
        echo "SHA-1 Checksum  : $RAW_HASH" >> manifest_linux.txt
        echo "==================================================" >> manifest_linux.txt

    - name: Upload Linux Asset to Job Memory
      uses: actions/upload-artifact@v4
      with:
        name: linux-assets
        path: dist/

  publish-github-release:
    needs: [build-and-release, compile-windows, compile-linux]
    runs-on: ubuntu-latest
    steps:
    - name: Download Compiled Windows Assets
      uses: actions/download-artifact@v4
      with:
        name: windows-assets
        path: release_files

    - name: Download Compiled Linux Assets
      uses: actions/download-artifact@v4
      with:
        name: linux-assets
        path: release_files

    - name: Create Official GitHub Release
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true
        tag: ${{ needs.build-and-release.outputs.app_version }}
        name: Release ${{ needs.build-and-release.outputs.app_version }}
        body: |
          ## Automated Build Success!
          Standalone application binary file deployment packages compiled successfully.
          
          ### Verification Footprint Note
          Please inspect the `manifest_linux.txt` or `manifest_windows.txt` to verify your matching SHA-1 integrity hash keys.
        artifacts: "release_files/*"
        token: ${{ secrets.GITHUB_TOKEN }}
