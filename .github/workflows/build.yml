name: Compile Standalone Binary

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.get_version.outputs.VERSION }}
    steps:
    - name: Checkout Source Repository Code
      uses: actions/checkout@v4

    - name: Extract Version from Source
      id: get_version
      run: |
        VERSION_STR=$(python3 -c "import re; f=open('master/project_saver.py'); m=re.search(r'VERSION\s*=\s*[\"\']([^\"\']+)[\"\']', f.read()); print(m.group(1)) if m else print('')")
        if [ -z "$VERSION_STR" ]; then
          echo "[-] Error: Failed to extract VERSION string from source code."
          exit 1
        fi
        echo "VERSION=$VERSION_STR" >> $GITHUB_OUTPUT
        echo "[+] Successfully captured version string: $VERSION_STR"

  compile-windows:
    needs: build-and-release
    runs-on: windows-latest
    steps:
    - name: Checkout Source Repository Code
      uses: actions/checkout@v4

    - name: Setup Python Environment Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Packaging Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller beautifulsoup4 reportlab

    - name: Generate Dynamic Version Info Resource File
      shell: bash
      run: |
        VER="${{ needs.build-and-release.outputs.app_version }}"
        CLEAN_VER=(echo VER | sed 's/[vV]//g')
        IFS='.' read -r major minor patch <<< "$CLEAN_VER"
        major=${major:-0}; minor=minor:-0; patch={patch:-0}
        
        cat <<EOF > master/version_info.txt
        VSVersionInfo(
          ffi=FixedFileInfo(
            filevers=($major, minor, patch, 0),
            prodvers=($major, minor, patch, 0),
            mask=0x3f,
            flags=0x0,
            OS=0x40004,
            fileType=0x1,
            subtype=0x0,
            date=(0, 0)
          ),
          kids=[
            StringFileInfo([
              StringTable(
                '040904b0',
                [
                  StringChar('CompanyName', 'Gunther Voet'),
                  StringChar('FileDescription', 'Project Saver Background Service Daemon'),
                  StringChar('FileVersion', '$CLEAN_VER'),
                  StringChar('InternalName', 'project_saver'),
                  StringChar('LegalCopyright', 'Copyright © 2026 Gunther Voet. All Rights Reserved.'),
                  StringChar('OriginalFilename', 'project_saver.exe'),
                  StringChar('ProductName', 'Project Saver Application'),
                  StringChar('ProductVersion', '$CLEAN_VER')
                ]
              )
            ]),
            VarFileInfo([VarChar('Translation', [1033, 1200])])
          ]
        )
        EOF
        echo "[+] Dynamic version_info.txt file generated successfully."

    - name: Compile Standalone Executable
      working-directory: ./master
      run: |
        pyinstaller --onefile --distpath ../dist --workpath ../build --version-file=version_info.txt project_saver.py

    - name: Generate Release Manifest
      shell: bash
      run: |
        cd dist
        RAW_HASH=$(certutil -hashfile project_saver.exe SHA1 | sed -n '2p' | tr -d '[:space:]')
        echo "==================================================" > manifest.txt
        echo "   PROJECT SAVER RELEASE MANIFEST                 " >> manifest.txt
        echo "==================================================" >> manifest.txt
        echo "Build Timestamp : $(date -u)" >> manifest.txt
        echo "Version Tag     : ${{ needs.build-and-release.outputs.app_version }}" >> manifest.txt
        echo "Platform        : Windows x64 Standalone Asset" >> manifest.txt
        echo "Application File: project_saver.exe" >> manifest.txt
        echo "--------------------------------------------------" >> manifest.txt
        echo "SHA-1 Checksum  : $RAW_HASH" >> manifest.txt
        echo "==================================================" >> manifest.txt
        mv project_saver.exe project_saver_${{ needs.build-and-release.outputs.app_version }}.exe

    - name: Upload Windows Asset to Job Memory
      uses: actions/upload-artifact@v4
      with:
        name: windows-assets
        path: dist/

  compile-linux:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Repository Code
      uses: actions/checkout@v4

    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Packaging Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller beautifulsoup4 reportlab

    - name: Compile Linux Binary
      working-directory: ./master
      run: |
        pyinstaller --onefile --distpath ../dist --workpath ../build project_saver.py

    - name: Generate Release Manifest
      run: |
        cd dist
        RAW_HASH=$(sha1sum project_saver | awk '{print $1}')
        echo "==================================================" > manifest.txt
        echo "   PROJECT SAVER RELEASE MANIFEST                 " >> manifest.txt
        echo "==================================================" >> manifest.txt
        echo "Build Timestamp : $(date -u)" >> manifest.txt
        echo "Version Tag     : ${{ needs.build-and-release.outputs.app_version }}" >> manifest.txt
        echo "Platform        : Linux x64 Standalone Asset" >> manifest.txt
        echo "Application File: project_saver" >> manifest.txt
        echo "--------------------------------------------------" >> manifest.txt
        echo "SHA-1 Checksum  : $RAW_HASH" >> manifest.txt
        echo "==================================================" >> manifest.txt
        mv project_saver project_saver_${{ needs.build-and-release.outputs.app_version }}_linux

    - name: Upload Linux Asset to Job Memory
      uses: actions/upload-artifact@v4
      with:
        name: linux-assets
        path: dist/

  publish-github-release:
    needs: [build-and-release, compile-windows, compile-linux]
    runs-on: ubuntu-latest
    steps:
    - name: Download Compiled Windows Assets
      uses: actions/download-artifact@v4
      with:
        name: windows-assets
        path: release_files

    - name: Download Compiled Linux Assets
      uses: actions/download-artifact@v4
      with:
        name: linux-assets
        path: release_files

    - name: Create Official GitHub Release
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true
        tag: ${{ needs.build-and-release.outputs.app_version }}
        name: Release ${{ needs.build-and-release.outputs.app_version }}
        body: |
          ## Automated Build Success!
          Standalone application binary file deployment packages compiled successfully.
          
          ### Verification Footprint Note
          Please inspect the `manifest.txt` to verify your matching SHA-1 integrity hash keys.
        artifacts: "release_files/*"
        token: ${{ secrets.GITHUB_TOKEN }}
